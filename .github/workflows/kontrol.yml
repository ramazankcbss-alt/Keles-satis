name: Kod Kontrolü

# Birleştirme isteklerinde (PR) kodun derlenebildiğini ve testlerin
# geçtiğini kontrol eder. APK üretmez, sürüm yayınlamaz.
on:
  pull_request:

jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Paketler
        run: flutter pub upgrade --major-versions firebase_core firebase_auth cloud_firestore flutter_lints

      - name: Analiz
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Testler
        run: flutter test
