name: Yeni projeye taşıma

# Keleş Satış hesaplarını ve verilerini egitim-takip-5a833 projesinden
# keles-satis projesine taşır. tasima/komut.txt dosyasına "kontrol" ya da
# "tasi" yazılıp gönderildiğinde (ya da Actions sekmesinden elle) çalışır.
#
# Servis hesabı anahtarları tasima/anahtarlar.enc içinde şifreli durur;
# şifresi TASIMA_SIFRESI gizli ayarındadır. Taşıma bittikten sonra bu dosya
# silinmeli ve anahtarlar Firebase Console'dan iptal edilmelidir.
on:
  push:
    branches: [main]
    paths:
      - 'tasima/komut.txt'
  workflow_dispatch:
    inputs:
      mod:
        description: 'kontrol ya da tasi'
        required: true
        default: 'kontrol'

permissions:
  contents: read

jobs:
  tasi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Mod
        run: |
          MOD="${{ github.event.inputs.mod }}"
          [ -z "$MOD" ] && MOD=$(tr -d ' \r\n' < tasima/komut.txt)
          case "$MOD" in kontrol|tasi) ;; *) echo "::error::Geçersiz mod: $MOD"; exit 1;; esac
          echo "MOD=$MOD" >> "$GITHUB_ENV"
          echo "Mod: $MOD"

      - name: Anahtarları çöz
        env:
          TASIMA_SIFRESI: ${{ secrets.TASIMA_SIFRESI }}
        run: |
          if [ -z "$TASIMA_SIFRESI" ]; then
            echo "::error::TASIMA_SIFRESI gizli ayarı eksik."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/k"
          openssl enc -d -aes-256-cbc -pbkdf2 -in tasima/anahtarlar.enc -pass env:TASIMA_SIFRESI \
            | tar -x -C "$RUNNER_TEMP/k"
          ls "$RUNNER_TEMP/k"

      - name: Bağımlılıklar
        working-directory: tasima
        run: npm install --no-save --no-audit --no-fund firebase-admin@13

      - name: Taşıma betiği
        working-directory: tasima
        env:
          ESKI_ANAHTAR: ${{ runner.temp }}/k/eski.json
          YENI_ANAHTAR: ${{ runner.temp }}/k/yeni.json
        run: node tasi.js "$MOD"

      - name: Anahtarları sil
        if: always()
        run: rm -rf "$RUNNER_TEMP/k"
